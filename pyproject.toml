[project]
name = "diagninten98"
version = "0.4.0"
description = "Read-only Nintendo Switch (HAC-001) diagnostics for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "libusb1>=3.1.0",
]

[project.scripts]
diagninten98 = "diagninten98.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagninten98"]

[dependency-groups]
dev = [
    "capstone>=5.0.9",
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "e2e: end-to-end тесты со скриншотами GUI",
]
