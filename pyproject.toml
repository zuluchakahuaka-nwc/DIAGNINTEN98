[project]
name = "diagninten98"
version = "0.1.0"
description = "Read-only Nintendo Switch (HAC-001) diagnostics for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "libusb1>=3.1.0",
]

[project.scripts]
diagninten98 = "diagninten98.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagninten98"]
